services:
   database:
     container_name: ${PROJECT_NAME}_database
     hostname: postgres
     image: postgres:17.2
     ports:
       - ${DB_PORT}:5432
     volumes:
       - db-data:/var/lib/postgresql/pgdata
     environment:
       POSTGRES_DB: ${DB_NAME}
       POSTGRES_USER: ${DB_USERNAME}
       POSTGRES_PASSWORD: ${DB_PASSWORD}
       PGDATA: /var/lib/postgresql/pgdata
     networks:
       - main_network
     restart: unless-stopped

   telegram:
     container_name: ${PROJECT_NAME}_bot
     build: .
     volumes:
       - ./src:/app  # For development only
     env_file:
       - .env
     environment:
       DB_HOST: database
       DB_PORT: 5432
       DB_NAME: ${DB_NAME}
       REDIS_HOST: redis
     networks:
       - main_network
     depends_on:
        - database
        - redis
     restart: unless-stopped
     command: python app.py

   redis:
      image: redis:7.4.1-alpine
      container_name: ${PROJECT_NAME}_cache
      networks:
        - main_network
      command: redis-server --save 20 1 --loglevel warning --port ${REDIS_INNER_PORT}

networks:
  main_network:
    name: ${PROJECT_NAME}_network
    driver: bridge

volumes:
  db-data:
